<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Nguyền Làm Dog - Được Tạo Bởi Đông</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d0914;
            color: #ffffff;
            overflow-x: hidden;
        }

        .font-fredoka {
            font-family: 'Fredoka', cursive;
        }

        /* Glowing text effects */
        .glow-title {
            text-shadow: 0 0 10px #ff2a6d, 0 0 20px #ff2a6d, 0 0 30px #ff2a6d;
        }

        .glow-curse {
            text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 45px #ff0055;
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% {
                text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 30px #ff0055;
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 25px #ff0055, 0 0 50px #ff0055, 0 0 75px #ff0055;
                transform: scale(1.02);
            }
        }

        /* Custom wiggle animation for cursed dog face */
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
        }

        .animate-wiggle {
            animation: wiggle 0.8s ease-in-out infinite;
        }

        /* Float animation for emojis */
        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .toast-notification {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative">

    <!-- Canvas for Floating Emojis -->
    <canvas id="emojiCanvas" class="floating-bg"></canvas>

    <!-- Header Section: Created by Dong -->
    <header class="w-full max-w-2xl text-center pt-6 z-10">
        <div class="inline-block bg-gradient-to-r from-purple-900/80 via-pink-900/80 to-purple-900/80 border border-pink-500/50 backdrop-blur-md px-6 py-2.5 rounded-full shadow-lg shadow-pink-500/20 mb-2">
            <span class="text-xs uppercase tracking-widest text-pink-300 font-semibold block">Trang web này</span>
            <h2 class="text-xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-300 uppercase glow-title font-fredoka">
                ✨ ĐƯỢC TẠO BỞI ĐÔNG ✨
            </h2>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-2xl my-auto py-6 z-10 flex flex-col items-center">
        
        <!-- Cursed Card -->
        <div class="w-full bg-slate-900/90 border-2 border-red-600/80 rounded-3xl p-6 md:p-10 backdrop-blur-lg shadow-2xl shadow-red-900/50 text-center relative overflow-hidden">
            
            <!-- Spooky corner badges -->
            <div class="absolute -top-10 -right-10 bg-red-600 text-white font-bold p-8 rounded-full transform rotate-12 text-xs uppercase shadow-lg">
                Cảnh báo!
            </div>

            <!-- Animated Dog Emoji/Meme -->
            <div class="text-7xl md:text-9xl my-4 animate-wiggle inline-block filter drop-shadow-[0_0_20px_rgba(255,0,85,0.8)] cursor-pointer select-none" id="dogIcon" title="Bấm vào đây để sủa!">
                🐶
            </div>

            <!-- Main Curse Text -->
            <div class="space-y-4 my-4">
                <h1 class="text-2xl md:text-4xl lg:text-5xl font-black text-red-500 uppercase tracking-wide glow-curse font-fredoka leading-tight">
                    Mày đã dính lời nguyền làm DOG! 🐕
                </h1>
                
                <p class="text-lg md:text-2xl font-bold text-amber-300 border-2 border-dashed border-amber-500/50 bg-amber-950/40 p-4 rounded-2xl leading-relaxed">
                    "Gửi wed cho thg khác để chuyển lời nguyền sang thg khác!" 🔮
                </p>
            </div>

            <!-- Transformation Timer -->
            <div class="my-6 bg-purple-950/60 border border-purple-500/30 rounded-2xl p-4">
                <div class="text-xs uppercase tracking-wider text-purple-300 mb-1 font-semibold">
                    Thời gian còn lại trước khi biến thành cún thật:
                </div>
                <div id="countdown" class="text-3xl md:text-4xl font-mono font-bold text-pink-400 tracking-wider">
                    04:59.99
                </div>
                <div class="w-full bg-purple-900/50 rounded-full h-2.5 mt-3 overflow-hidden">
                    <div id="timerBar" class="bg-gradient-to-r from-pink-500 to-red-500 h-2.5 rounded-full transition-all duration-100" style="width: 100%"></div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mt-6">
                
                <!-- Share/Pass Curse Button -->
                <button id="shareBtn" class="w-full sm:w-auto flex-1 bg-gradient-to-r from-red-600 via-pink-600 to-purple-600 hover:from-red-500 hover:to-purple-500 text-white font-black text-lg py-4 px-6 rounded-2xl shadow-lg shadow-red-600/40 transform active:scale-95 transition-all flex items-center justify-center gap-3 border border-pink-400/30">
                    <i class="fa-solid fa-share-nodes text-xl"></i>
                    <span>CHUYỂN LỜI NGUYỀN NGAY</span>
                </button>

                <!-- Bark Button -->
                <button id="barkBtn" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg py-4 px-6 rounded-2xl shadow-lg shadow-amber-500/30 transform active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-volume-high"></i>
                    <span>SỦA "GÂU GÂU"</span>
                </button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl text-center py-4 z-10 text-slate-500 text-xs">
        <p>© Web troll vui vẻ - Được sáng tạo bởi <span class="text-pink-400 font-semibold">Đông</span> 🐶</p>
    </footer>

    <!-- Toast Notification Box -->
    <div id="toast" class="toast-notification fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 border-2 border-pink-500 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 translate-y-32 opacity-0 pointer-events-none">
        <span class="text-2xl" id="toastIcon">🐶</span>
        <div>
            <div id="toastTitle" class="font-bold text-sm text-pink-400">Thông báo</div>
            <div id="toastMessage" class="text-xs text-slate-300">Đã sao chép link!</div>
        </div>
    </div>

    <!-- Hidden Input for Copy Fallback -->
    <input type="text" id="copyInput" class="sr-only" readonly>

    <script>
        // Web Audio API Bark Synthesizer
        function playSynthesizedBark() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(380 + Math.random() * 80, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.6, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        // Particle Canvas Animation
        const canvas = document.getElementById('emojiCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const emojis = ['🐶', '🐕', '🦴', '⚡', '🔮', '✨', '🐾'];
        const particles = [];

        for (let i = 0; i < 25; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 20 + 20,
                text: emojis[Math.floor(Math.random() * emojis.length)],
                speedY: Math.random() * 1.5 + 0.5,
                speedX: (Math.random() - 0.5) * 0.8,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.02
            });
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;

                if (p.y < -50) {
                    p.y = canvas.height + 50;
                    p.x = Math.random() * canvas.width;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.font = `${p.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 0.4;
                ctx.fillText(p.text, 0, 0);
                ctx.restore();
            });

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Countdown Timer Logic
        let totalSeconds = 299.99; // 4:59.99
        const countdownEl = document.getElementById('countdown');
        const timerBar = document.getElementById('timerBar');

        const timerInterval = setInterval(() => {
            totalSeconds -= 0.05;
            if (totalSeconds <= 0) {
                totalSeconds = 0;
                clearInterval(timerInterval);
                countdownEl.innerText = "00:00.00";
                showToast("⚡ LỜI NGUYỀN HOÀN TẤT!", "Mày đã biến thành Cún 100%! Hãy gửi web ngay!", "🐶");
            } else {
                const mins = Math.floor(totalSeconds / 60);
                const secs = Math.floor(totalSeconds % 60);
                const ms = Math.floor((totalSeconds % 1) * 100);
                countdownEl.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
                
                const percent = (totalSeconds / 300) * 100;
                timerBar.style.width = `${percent}%`;
            }
        }, 50);

        // Toast Notification System
        let toastTimeout;
        function showToast(title, message, icon = '🐶') {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').innerText = icon;

            toast.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
            }, 4000);
        }

        // Copy / Share Functionality
        const shareBtn = document.getElementById('shareBtn');
        shareBtn.addEventListener('click', () => {
            playSynthesizedBark();

            const pageUrl = window.location.href;
            const copyInput = document.getElementById('copyInput');
            copyInput.value = pageUrl;
            copyInput.select();
            
            let copied = false;
            try {
                copied = document.execCommand('copy');
            } catch (err) {
                copied = false;
            }

            if (copied) {
                showToast("ĐÃ COPY LINK LỜI NGUYỀN! 🚀", "Gửi nhanh cho bạn bè để chuyển lời nguyền sang người đó!", "🔥");
            } else {
                showToast("HÃY SAO CHÉP LINK WEB!", "Gửi trang web này cho đứa khác để giải nguyền!", "⚠️️");
            }
        });

        // Bark Button Interaction
        const barkBtn = document.getElementById('barkBtn');
        const dogIcon = document.getElementById('dogIcon');

        function triggerBark() {
            playSynthesizedBark();
            dogIcon.classList.add('scale-125');
            setTimeout(() => dogIcon.classList.remove('scale-125'), 150);
            showToast("GÂU GÂU! 🐕", "Mày vừa sủa thành công! Lời nguyền đang ngấm...", "🦴");
        }

        barkBtn.addEventListener('click', triggerBark);
        dogIcon.addEventListener('click', triggerBark);
    </script>
</body>
</html>
